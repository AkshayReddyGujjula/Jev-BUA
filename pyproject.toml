[project]
name = "AgentJevUltraFast"
version = "0.1.0"
description = "A browser agent that chooses instead of generating."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["browser-harness==0.1.13", "httpx[http2]>=0.28,<1"]

[project.optional-dependencies]
cloud = ["browser-use-sdk>=3.11.3,<4"]

[project.scripts]
jev = "AgentJevUltraFast.cli:main"
jev-cloud = "AgentJevUltraFast.cloud_runner:main"
jev-mcp = "jev_mcp_server:main"
jev-ui = "AgentJevUltraFast.demo:main"
agent-jev = "AgentJevUltraFast.demo:main"

[tool.hatch.build.targets.wheel]
packages = ["AgentJevUltraFast"]

[tool.hatch.build.targets.wheel.force-include]
"jev_mcp_server.py" = "jev_mcp_server.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1", "pillow>=11,<13"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs a real Chrome and paid model APIs; run with JEV_LIVE=1 -m live"]
addopts = "-m 'not live'"
